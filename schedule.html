<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDMqDQWkQI0Pj3HkQs0bqmT0JTmi8mVfJk",
    authDomain: "moez-125d2.firebaseapp.com",
    projectId: "moez-125d2",
    storageBucket: "moez-125d2.firebasestorage.app",
    messagingSenderId: "340855843654",
    appId: "1:340855843654:web:cc672b26682c19903e5347",
    measurementId: "G-FNYMMC3Z6V"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const yearParam = parseInt(urlParams.get('year') || "1");

  const yearNames = { 1: "السنة الأولى", 2: "السنة الثانية", 3: "السنة الثالثة", 4: "السنة الرابعة" };
  document.getElementById('yearTitle').innerText = `جدول محاضرات ${yearNames[yearParam] || 'الدراسة'}`;

  // جلب رابط جروب الواتساب الخاص بالسنة من الفايربيس تلقائياً
  onSnapshot(doc(db, "groups", `year_${yearParam}`), (docSnap) => {
    if (docSnap.exists() && docSnap.data().url) {
      document.getElementById('groupLink').href = docSnap.data().url;
      document.getElementById('groupCard').style.display = "block";
    } else {
      document.getElementById('groupCard').style.display = "none";
    }
  });

  const days = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];

  function getSlotIndex(slotStr) {
    if (!slotStr) return -1;
    let s = slotStr.trim();
    if (s.includes("08:30") || s.includes("8:30") || s.includes("08:00") || s.includes("8:00")) return 0;
    if (s.includes("10:30") || s.includes("10:00")) return 1;
    if (s.includes("12:30") || s.includes("12:00")) return 2;
    if (s.includes("02:30") || s.includes("2:30") || s.includes("02:00") || s.includes("2:00")) return 3;
    return -1;
  }

  // ⭐ دالة المطابقة الذكية والشاملة للسنوات (تعالج النصوص والأرقام بدقة تامة)
  function matchYear(docYear, targetYearNum) {
    if (!docYear) return false;
    const map = {
      1: ["1", "السنة الأولى", "الأولى", "الأوليه"],
      2: ["2", "السنة الثانية", "الثانية"],
      3: ["3", "السنة الثالثة", "الثالثة"],
      4: ["4", "السنة الرابعة", "الرابعة"]
    };
    const d = String(docYear).trim();
    const targetValues = map[targetYearNum] || [String(targetYearNum)];
    
    // التحقق المباشر عبر القاموس أو الاحتواء النصي
    if (targetValues.some(val => d.includes(val) || val.includes(d))) return true;
    
    // استخراج أي رقم موجود في النص كاحتياطي
    const extractedNum = parseInt(d.replace(/\D/g, "")) || 0;
    return extractedNum === targetYearNum;
  }

  // الاستماع اللحظي الفوري لجميع المحاضرات وعرضها بذكاء
  onSnapshot(collection(db, "lectures"), (snapshot) => {
    let grid = {};
    days.forEach(d => { grid[d] = [null, null, null, null]; });

    snapshot.forEach(docSnap => {
      const item = docSnap.data();
      
      // استخدام دالة المطابقة الذكية للسنة (سواء كانت "السنة الثالثة" أو رقم 3)
      if (matchYear(item.year, yearParam) || matchYear(item.yearNum, yearParam)) {
        let dayKey = item.day ? item.day.trim().replace("إ", "ا") : "";
        let idx = getSlotIndex(item.slot);
        
        if (grid[dayKey] && idx !== -1) {
          grid[dayKey][idx] = item;
        }
      }
    });

    let html = "";
    days.forEach(day => {
      html += `<tr><th style="font-weight: 900; color: #fff;">${day}</th>`;
      
      for (let i = 0; i < 4; i++) {
        let lec = grid[day][i];
        if (lec) {
          let statusHTML = "";
          let extraClass = "";

          // تحديد شكل وشارة الحالة للمادة
          if (lec.status === "مؤكدة" || lec.status === "confirmed") {
            statusHTML = `<div class="status-badge status-confirmed">✓ مؤكدة</div>`;
            extraClass = "lec-confirmed";
          } else if (lec.status === "ملغاة" || lec.status === "cancelled") {
            statusHTML = `<div class="status-badge status-cancelled">✕ ملغاة</div>`;
            extraClass = "lec-cancelled";
          } else {
            statusHTML = `<div class="status-badge status-pending">● غير محددة</div>`;
          }

          html += `
            <td class="slot-cell has-lecture ${extraClass}">
              ${statusHTML}
              <div class="lec-name">${lec.name}</div>
              <div class="lec-code">${lec.code}</div>
              <div class="lec-room">📍 ${lec.room}</div>
              <div class="lec-teacher">👨‍🏫 ${lec.teacher}</div>
            </td>
          `;
        } else {
          html += `<td class="slot-cell"></td>`;
        }
      }
      html += `</tr>`;
    });

    document.getElementById('tableBody').innerHTML = html;
  });
</script>
