<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الكنترول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>لوحة الكنترول</h1>
  <div id="login" class="card login">
    <label for="pw">كلمة السر</label>
    <input id="pw" type="password">
    <button id="go" class="btn" style="width:100%">دخول</button>
    <p id="err" class="err"></p>
  </div>
  <div id="panel" class="hide">
    
    <!-- قسم إدارة اللافتة الإعلانية الجديد داخل الكنترول المحمي -->
    <div class="card">
      <h2>إدارة اللافتة الإعلانية (الصفحة الرئيسية)</h2>
      <div class="form">
        <div style="grid-column:1/-1">
          <label>نص اللافتة أو التنبيه</label>
          <textarea id="bannerText" rows="3" placeholder="اكتب نص الإعلان هنا..." style="width:100%; padding:10px; background:#0b0f19; color:#fff; border:1px solid #38bdf8; border-radius:8px; font-family:'Cairo';"></textarea>
        </div>
        <div style="grid-column:1/-1"><button id="saveBannerBtn" class="btn green" style="width:100%">حفظ ونشر اللافتة</button></div>
      </div>
    </div>

    <div class="card">
      <div class="top"><h2>إضافة مادة</h2><button id="out" class="btn red sm">خروج</button></div>
      <form id="add" class="form">
        <div><label>اسم المادة</label><input id="name" required></div>
        <div><label>كود المادة</label><input id="code" required></div>
        <div><label>السنة الدراسية</label><select id="year"></select></div>
        <div><label>اليوم</label><select id="day"></select></div>
        <div><label>الفترة الزمنية</label><input id="slot" placeholder="08:00 - 10:00" required></div>
        <div><label>القاعة</label><input id="room" required></div>
        <div><label>اسم الأستاذ</label><input id="teacher" required></div>
        <div><label>كود الأستاذ</label><input id="tcode" required></div>
        <div style="grid-column:1/-1"><button class="btn green" style="width:100%">إضافة</button></div>
      </form>
    </div>
    <div class="card">
      <h2>المواد المضافة</h2>
      <div class="tw"><table>
        <thead><tr><th>السنة</th><th>اليوم</th><th>الوقت</th><th>المادة</th><th>الأستاذ</th><th>كود الأستاذ</th><th>الحالة</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
    <div class="card">
      <h2>تغيير كلمة السر</h2>
      <form id="pwf" class="form">
        <div><label>الحالية</label><input id="old" type="password" required></div>
        <div><label>الجديدة (6 أحرف على الأقل)</label><input id="new1" type="password" minlength="6" required></div>
        <div><label>تأكيد الجديدة</label><input id="new2" type="password" minlength="6" required></div>
        <div style="grid-column:1/-1"><button class="btn" style="width:100%">تغيير</button></div>
      </form>
    </div>
  </div>
  <div class="links"><a class="btn" href="index.html">الرئيسية</a></div>
</div>
<script type="module">
import { DAYS, YEARS, watchLectures, addLecture, deleteLecture, checkAdmin, changeAdmin, esc, badge } from "./app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db = getFirestore();
const $ = id => document.getElementById(id);

async function loadBanner() {
  try {
    const docSnap = await getDoc(doc(db, "settings", "banner"));
    if (docSnap.exists()) {
      $("bannerText").value = docSnap.data().text || "";
    }
  } catch (e) {
    console.error(e);
  }
}

$("saveBannerBtn").onclick = async () => {
  try {
    const text = $("bannerText").value.trim();
    await setDoc(doc(db, "settings", "banner"), { text: text });
    alert("تم نشر اللافتة الإعلانية بنجاح!");
  } catch (x) {
    alert("تعذر حفظ اللافتة: " + x.message);
  }
};

function show() {
  $("login").classList.add("hide"); $("panel").classList.remove("hide");
  $("day").innerHTML = DAYS.map(d => `<option>${d}</option>`).join("");
  $("year").innerHTML = YEARS.map((y, i) => `<option value="${i + 1}">${y}</option>`).join("");
  loadBanner();
  watchLectures(null, null, list => {
    list.sort((a, b) => a.year - b.year);
    $("rows").innerHTML = list.length ? list.map(l => `<tr>
      <td>${esc(YEARS[l.year - 1])}</td><td>${esc(l.day)}</td><td>${esc(l.slot)}</td><td>${esc(l.name)}</td>
      <td>${esc(l.teacher)}</td><td>${esc(l.teacherCode)}</td><td>${badge(l.status)}</td>
      <td><button class="btn red sm" data-id="${l.id}">حذف</button></td></tr>`).join("")
      : '<tr><td colspan="8" class="msg">لا توجد مواد. أضف أول مادة من النموذج أعلاه.</td></tr>';
  }, e => $("rows").innerHTML = `<tr><td colspan="8" class="msg err">${esc(e.message)}</td></tr>`);
}
$("go").onclick = async () => {
  try {
    if (await checkAdmin($("pw").value)) { sessionStorage.admin = "1"; show(); }
    else $("err").textContent = "كلمة السر غير صحيحة";
  } catch (x) { $("err").textContent = "خطأ اتصال: " + x.message; }
};
$("pw").onkeydown = e => e.key === "Enter" && $("go").click();
$("out").onclick = () => { sessionStorage.removeItem("admin"); location.reload(); };
$("add").onsubmit = async e => {
  e.preventDefault();
  const g = id => $(id).value.trim();
  try {
    await addLecture({ name: g("name"), code: g("code"), year: +$("year").value, day: $("day").value, slot: g("slot"),
      room: g("room"), teacher: g("teacher"), teacherCode: g("tcode"), status: "pending" });
    e.target.reset();
  } catch (x) { alert("تعذر الحفظ: " + x.message); }
};
$("rows").onclick = async e => {
  const b = e.target.closest("button[data-id]");
  if (b && confirm("حذف هذه المادة نهائياً؟")) try { await deleteLecture(b.dataset.id); } catch (x) { alert(x.message); }
};
$("pwf").onsubmit = async e => {
  e.preventDefault();
  if ($("new1").value !== $("new2").value) return alert("كلمتا السر الجديدتان غير متطابقتين");
  try {
    if (await changeAdmin($("old").value, $("new1").value)) { alert("تم تغيير كلمة السر"); e.target.reset(); }
    else alert("كلمة السر الحالية غير صحيحة");
  } catch (x) { alert("تعذر التغيير: " + x.message); }
};
if (sessionStorage.admin) show();
</script>
</body>
</html>
