<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جداول المحاضرات الدراسية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- مكان عرض اللافتة الإعلانية (قراءة فقط) -->
<div id="announcementBanner" style="display: none; background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; padding: 12px 20px; border-radius: 10px; font-weight: bold; text-align: center; margin: 15px auto; max-width: 900px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);">
  🚨 <span id="bannerContent"></span>
</div>

<div class="wrap">
  <h1>جداول المحاضرات الدراسية</h1>
  
  <div class="card">
    <h2>اختر سنتك الدراسية</h2>
    <div class="grid">
      <a class="btn big" href="schedule.html?year=1">السنة الأولى</a>
      <a class="btn big" href="schedule.html?year=2">السنة الثانية</a>
      <a class="btn big" href="schedule.html?year=3">السنة الثالثة</a>
      <a class="btn big" href="schedule.html?year=4">السنة الرابعة</a>
    </div>

    <!-- دليل تواصل الأساتذة (قابل للفتح والإغلاق بضغطة زر) -->
    <div style="margin-top: 25px; border: 1px solid var(--line); border-radius: 12px; background: rgba(11, 16, 36, 0.6); overflow: hidden;">
      
      <!-- شريط العنوان القابل للضغط -->
      <button id="toggleTeachersBtn" type="button" style="width: 100%; padding: 15px 20px; background: rgba(255, 255, 255, 0.05); border: none; color: #4deeea; font-size: 1.05rem; font-family: 'Cairo', sans-serif; font-weight: bold; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.3s;">
        <span style="display: flex; align-items: center; gap: 8px;">
          <i class="fab fa-whatsapp" style="color: #25d366; font-size: 1.3rem;"></i> دليل تواصل الأساتذة (واتساب)
        </span>
        <i id="toggleArrow" class="fas fa-chevron-down" style="transition: transform 0.3s; color: #a0aec0;"></i>
      </button>

      <!-- محتوى القائمة (مخفي افتراضياً) -->
      <div id="teachersContent" style="display: none; padding: 18px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
        <div id="publicTeachersList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;">
          <p style="color: #a0aec0; font-size: 0.9rem; grid-column: 1/-1; text-align: center;">جاري تحميل البيانات...</p>
        </div>
      </div>

    </div>

  </div>

  <div class="links">
    <a class="btn green" href="teacher.html">دخول الأستاذ</a>
    <a class="btn red" href="admin.html">لوحة الكنترول</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  
  const db = getFirestore(initializeApp({
    apiKey: "AIzaSyDMqDQWkQI0Pj3HkQs0bqmT0JTmi8mVfJk",
    authDomain: "moez-125d2.firebaseapp.com",
    projectId: "moez-125d2",
    storageBucket: "moez-125d2.firebasestorage.app",
    messagingSenderId: "340855843654",
    appId: "1:340855843654:web:cc672b26682c19903e5347",
    measurementId: "G-FNYMMC3Z6V"
  }));

  // كود التفاعل: فتح وإغلاق قائمة الأساتذة عند الضغط
  const toggleBtn = document.getElementById("toggleTeachersBtn");
  const teachersContent = document.getElementById("teachersContent");
  const toggleArrow = document.getElementById("toggleArrow");

  toggleBtn.addEventListener("click", () => {
    const isHidden = teachersContent.style.display === "none";
    teachersContent.style.display = isHidden ? "block" : "none";
    toggleArrow.style.transform = isHidden ? "rotate(180deg)" : "rotate(0deg)";
  });

  // الاستماع اللحظي للكتلة العارضة
  onSnapshot(doc(db, "settings", "banner"), (docSnap) => {
    if (docSnap.exists() && docSnap.data().text) {
      const banner = document.getElementById('announcementBanner');
      document.getElementById('bannerContent').innerText = docSnap.data().text;
      banner.style.display = "block";
    } else {
      document.getElementById('announcementBanner').style.display = "none";
    }
  });

  // جلب وعرض الأساتذة في الواجهة الرئيسية
  const publicTeachersRef = collection(db, "teachers");
  onSnapshot(publicTeachersRef, (snapshot) => {
    const container = document.getElementById("publicTeachersList");
    if (!container) return;
    container.innerHTML = "";
    
    if (snapshot.empty) {
      container.innerHTML = "<p style='color: #a0aec0; font-size: 0.9rem; grid-column: 1/-1; text-align: center;'>لا توجد بيانات مضافة للأساتذة حالياً.</p>";
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const card = document.createElement("div");
      card.style.cssText = "background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; text-align: right;";
      card.innerHTML = `
        <div>
          <h4 style="margin: 0 0 4px 0; color: #fff; font-size: 0.95rem;">${data.name}</h4>
          <span style="color: #a0aec0; font-size: 0.8rem;" dir="ltr">+${data.username}</span>
        </div>
        <a href="https://wa.me/${data.username}" target="_blank" style="background: #25d366; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; font-weight: bold; white-space: nowrap;">
          <i class="fab fa-whatsapp"></i> مراسلة
        </a>
      `;
      container.appendChild(card);
    });
  });
</script>
</body>
</html>
