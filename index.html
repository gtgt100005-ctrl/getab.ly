<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جداول المحاضرات الدراسية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- مكان عرض اللافتة الإعلانية (قراءة فقط) -->
<div id="announcementBanner" style="display: none; background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; padding: 12px 20px; border-radius: 10px; font-weight: bold; text-align: center; margin: 15px auto; max-width: 900px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);">
  🚨 <span id="bannerContent"></span>
</div>

<div class="wrap">
  <h1>جداول المحاضرات الدراسية</h1>
  
  <div class="card">
    <h2>اختر سنتك الدراسية</h2>
    <div class="grid">
      <a class="btn big" href="schedule.html?year=1">السنة الأولى</a>
      <a class="btn big" href="schedule.html?year=2">السنة الثانية</a>
      <a class="btn big" href="schedule.html?year=3">السنة الثالثة</a>
      <a class="btn big" href="schedule.html?year=4">السنة الرابعة</a>
    </div>

    <!-- واجهة تواصل الأساتذة (مخفية افتراضياً وتظهر فقط عند الضغط على الزر بالأسفل) -->
    <div id="teachersSection" style="display: none; margin-top: 25px; padding: 18px; background: rgba(11, 16, 36, 0.8); border: 1px solid var(--line); border-radius: 12px; text-align: center;">
      <h3 style="color: #4deeea; font-size: 1.1rem; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <i class="fab fa-whatsapp" style="color: #25d366; font-size: 1.4rem;"></i> دليل تواصل الأساتذة (واتساب)
      </h3>
      <div id="publicTeachersList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 15px;">
        <p style="color: #a0aec0; font-size: 0.9rem; grid-column: 1/-1;">جاري تحميل البيانات...</p>
      </div>
    </div>

  </div>

  <!-- الأزرار السفلية الثلاثة في سطر واحد -->
  <div class="links" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
    <a class="btn green" href="teacher.html">دخول الأستاذ</a>
    <a class="btn red" href="admin.html">لوحة الكنترول</a>
    <button id="toggleContactBtn" class="btn" style="background: #25d366; color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: none; font-family: 'Cairo', sans-serif;">
      <i class="fab fa-whatsapp"></i> التواصل مع الأساتذة
    </button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  
  const db = getFirestore(initializeApp({
    apiKey: "AIzaSyDMqDQWkQI0Pj3HkQs0bqmT0JTmi8mVfJk",
    authDomain: "moez-125d2.firebaseapp.com",
    projectId: "moez-125d2",
    storageBucket: "moez-125d2.firebasestorage.app",
    messagingSenderId: "340855843654",
    appId: "1:340855843654:web:cc672b26682c19903e5347",
    measurementId: "G-FNYMMC3Z6V"
  }));

  // إظهار وإخفاء واجهة الواتساب عند الضغط على الزر الثالث
  const contactBtn = document.getElementById("toggleContactBtn");
  const teachersSection = document.getElementById("teachersSection");

  contactBtn.addEventListener("click", () => {
    if (teachersSection.style.display === "none") {
      teachersSection.style.display = "block";
      teachersSection.scrollIntoView({ behavior: 'smooth' });
    } else {
      teachersSection.style.display = "none";
    }
  });

  // الاستماع اللحظي للكتلة العارضة
  onSnapshot(doc(db, "settings", "banner"), (docSnap) => {
    if (docSnap.exists() && docSnap.data().text) {
      const banner = document.getElementById('announcementBanner');
      document.getElementById('bannerContent').innerText = docSnap.data().text;
      banner.style.display = "block";
    } else {
      document.getElementById('announcementBanner').style.display = "none";
    }
  });

  // جلب وعرض الأساتذة في الواجهة
  const publicTeachersRef = collection(db, "teachers");
  onSnapshot(publicTeachersRef, (snapshot) => {
    const container = document.getElementById("publicTeachersList");
    if (!container) return;
    container.innerHTML = "";
    
    if (snapshot.empty) {
      container.innerHTML = "<p style='color: #a0aec0; font-size: 0.9rem; grid-column: 1/-1;'>لا توجد بيانات مضافة للأساتذة حالياً.</p>";
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const card = document.createElement("div");
      card.style.cssText = "background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; text-align: right;";
      card.innerHTML = `
        <div>
          <h4 style="margin: 0 0 4px 0; color: #fff; font-size: 0.95rem;">${data.name}</h4>
          <span style="color: #a0aec0; font-size: 0.8rem;" dir="ltr">+${data.username}</span>
        </div>
        <a href="https://wa.me/${data.username}" target="_blank" style="background: #25d366; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; font-weight: bold; white-space: nowrap;">
          <i class="fab fa-whatsapp"></i> مراسلة
        </a>
      `;
      container.appendChild(card);
    });
  });
</script>
</body>
</html>
